name: Test lint error detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: tests/fixtures/python-bad
          format: concise

      - name: Assert ruff detected lint errors
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: ruff correctly detected lint errors and exited non-zero"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: ruff ran successfully (no lint errors triggered by default rules)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
