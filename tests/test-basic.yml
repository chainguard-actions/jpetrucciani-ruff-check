name: Test basic usage - clean Python file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: tests/fixtures/clean.py
          format: github
      - name: Assert ruff output is empty (no lint errors)
        env:
          OUTPUT: ${{ steps.action.outputs.output }}
        run: |
          echo "output: '$OUTPUT'"
          if [ -n "$OUTPUT" ]; then
            echo "FAIL: expected no ruff output for clean file, got: $OUTPUT"
            exit 1
          fi
          echo "PASS: ruff found no issues in clean file"
