name: Test basic usage - clean Python file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean Python file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/clean"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/clean/hello.py" << 'EOF'
          """A simple clean Python module."""


          def greet(name: str) -> str:
              """Return a greeting string."""
              return f"Hello, {name}!"


          if __name__ == "__main__":
              print(greet("world"))
          EOF

      - id: action
        uses: .
        with:
          path: tests/fixtures/clean
          format: github

      - name: Assert ruff check passed (no output for clean code)
        env:
          OUTPUT: ${{ steps.action.outputs.output }}
        run: |
          echo "output: '$OUTPUT'"
          echo "PASS: ruff check completed successfully on clean Python file"
