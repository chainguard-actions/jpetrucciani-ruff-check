name: Test basic usage - clean Python file passes ruff check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: tests/fixtures/clean.py
          format: concise
      - name: Assert ruff passed on clean file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected ruff to succeed on clean file, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: ruff succeeded on clean Python file"
