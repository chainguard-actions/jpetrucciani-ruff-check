name: Test output format option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action-concise-format
        uses: .
        continue-on-error: true
        with:
          path: tests/fixtures/format-test
          format: concise

      - name: Assert ruff ran successfully with concise format
        env:
          OUTCOME: ${{ steps.action-concise-format.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: ruff ran successfully with concise output format"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: expected success but got failure with concise format"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - id: action-json-format
        uses: .
        continue-on-error: true
        with:
          path: tests/fixtures/format-test
          format: json

      - name: Assert ruff ran successfully with json format
        env:
          OUTCOME: ${{ steps.action-json-format.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: ruff ran successfully with json output format"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: expected success but got failure with json format"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
