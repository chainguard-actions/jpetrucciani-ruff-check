    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: tests/fixtures/python
          format: github

      - name: Assert ruff ran with github format on clean code
        run: |
          echo "PASS: ruff completed with github format output on clean Python code"
