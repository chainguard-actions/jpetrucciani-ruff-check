name: Test ruff check on clean Python code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run ruff on clean Python file
        id: action
        uses: .
        with:
          path: tests/fixtures/clean.py
          format: github
      - name: Assert ruff passed (no errors)
        env:
          OUTPUT: ${{ steps.action.outputs.output }}
        run: |
          echo "output: $OUTPUT"
          echo "PASS: ruff check completed successfully on clean code"
