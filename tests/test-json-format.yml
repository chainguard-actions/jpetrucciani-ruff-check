name: Test json output format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: tests/fixtures/unused_import.py
          format: json
        continue-on-error: true

      - name: Assert action failed and output format was json
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on file with lint issues (json format), but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with json format"
