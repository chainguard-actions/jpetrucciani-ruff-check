name: Test custom flags - select specific rules
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: tests/fixtures/python-bad
          flags: '--select F401'
          format: concise

      - name: Assert ruff ran with custom flags detecting unused import
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: ruff correctly detected unused import (F401) with custom --select flag"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: ruff ran successfully with custom flags"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
