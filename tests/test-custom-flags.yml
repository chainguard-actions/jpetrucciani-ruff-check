name: Test custom flags - select specific rules
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: tests/fixtures/clean
          flags: '--select E'
          format: github
      - name: Assert action succeeded with custom flags on clean code
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actual: '$ACTUAL'"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed with --select E on clean code, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: ruff ran successfully with custom flags"
