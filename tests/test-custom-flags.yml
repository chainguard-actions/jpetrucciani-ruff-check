name: Test ruff check with custom flags and json format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run ruff with select flag and json format on clean file
        id: action
        uses: .
        with:
          path: tests/fixtures/clean.py
          flags: '--select F'
          format: json
      - name: Assert ruff ran successfully with custom flags
        env:
          OUTPUT: ${{ steps.action.outputs.output }}
        run: |
          echo "output: $OUTPUT"
          echo "PASS: ruff check with custom flags completed successfully"
