name: Test custom flags and format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: ruff
        uses: .
        with:
          path: tests/fixtures/clean_python
          flags: '--select F'
          format: github

      - name: Assert ruff ran with custom flags
        env:
          OUTPUT: ${{ steps.ruff.outputs.output }}
        run: |
          echo "ruff output: $OUTPUT"
          echo "PASS: ruff completed with custom flags"
