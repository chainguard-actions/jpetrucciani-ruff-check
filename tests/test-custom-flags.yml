name: Test custom flags - use ruff flags to select specific rules
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: tests/fixtures/clean.py
          flags: '--select E,W'
          format: concise
      - name: Assert ruff passed with custom flags on clean file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected ruff to succeed with --select E,W on clean file, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: ruff succeeded with custom flags on clean file"
