name: Test ruff check detects lint errors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: tests/fixtures/bad_python
          format: text

      - name: Assert ruff detected lint errors and failed
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUT: ${{ steps.action.outputs.output }}
        run: |
          echo "outcome: '$OUTCOME'"
          echo "output: $OUTPUT"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: ruff correctly detected lint errors and exited non-zero"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected ruff to fail on bad code but it succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
