name: Test ruff detects lint errors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python file with lint errors
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/dirty"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/dirty/bad.py" << 'EOF'
          import os
          import sys
          x=1
          y = 2
          def foo():
              pass
          EOF

      - id: action
        uses: .
        with:
          path: tests/fixtures/dirty
          format: text
        continue-on-error: true

      - name: Assert ruff detected lint errors
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected ruff to fail on code with lint errors, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: ruff correctly detected lint errors"
