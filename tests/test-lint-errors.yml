name: Test lint errors - dirty Python file fails ruff
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: tests/fixtures/dirty.py
          format: github

      - name: Assert action failed due to lint errors
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUT: ${{ steps.action.outputs.output }}
        run: |
          echo "outcome: $OUTCOME"
          echo "output: $OUTPUT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected ruff to fail on dirty Python file, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: ruff correctly failed on Python file with lint errors"
