name: Test lint errors detected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: tests/fixtures/dirty
          format: github
      - name: Assert action failed due to lint errors
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actual: '$ACTUAL'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on dirty code, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: ruff correctly detected lint errors and failed"
