name: Test text output format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: tests/fixtures/dirty.py
          format: text
      - name: Assert ruff ran with text format and detected errors
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected ruff to fail on dirty file with text format, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: ruff correctly ran with text format and detected lint errors"
