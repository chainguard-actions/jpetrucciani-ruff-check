name: Test ruff check detects linting errors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dirty Python file with unused imports
        run: |
          printf 'import os\nimport sys\n\nx = 1\n' > "$GITHUB_WORKSPACE/ruff_dirty_test.py"
      - id: action
        uses: .
        with:
          path: ruff_dirty_test.py
          flags: '--select F401'
          format: github
        continue-on-error: true
      - name: Assert ruff detected errors
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "ruff outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected ruff to fail on dirty code, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: ruff correctly detected linting errors"
