name: Test failing lint - Python file with errors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a Python file with lint errors
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/dirty"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/dirty/bad.py" << 'EOF'
          import os
          import sys
          x=1
          y = 2
          def foo():
            pass
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: tests/fixtures/dirty
          format: github

      - name: Assert ruff check failed on bad Python file
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUT: ${{ steps.action.outputs.output }}
        run: |
          echo "outcome: $OUTCOME"
          echo "output: $OUTPUT"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: ruff correctly detected lint errors and failed"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: ruff should have failed on bad Python code but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
