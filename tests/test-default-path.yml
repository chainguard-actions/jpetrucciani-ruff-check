name: Test ruff check with default path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: tests/fixtures/clean_python/hello.py
          format: github

      - name: Assert ruff ran on specified file
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUT: ${{ steps.action.outputs.output }}
        run: |
          echo "outcome: '$OUTCOME'"
          echo "output: $OUTPUT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: ruff completed on specified file with github format"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed (Docker build or environment issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
