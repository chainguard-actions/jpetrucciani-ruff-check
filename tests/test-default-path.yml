name: Test ruff with default path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean Python file at workspace root level
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/default"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/default/main.py" << 'EOF'
          """A simple module."""


          def greet(name: str) -> str:
              """Return a greeting string."""
              return f"Hello, {name}!"
          EOF

      - id: action
        uses: .
        with:
          path: tests/fixtures/default
          format: github

      - name: Assert ruff passed with default-style invocation
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual: $ACTUAL"
          echo "PASS: ruff ran successfully on the specified path"
